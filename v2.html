// Historial estimado hacia atras: compra = fecha de compra o, si no hay, fecha de lanzamiento; el valor sube en linea recta desde el coste hasta el valor actual (o el precio de venta)
const HIST_INICIO="2023-07-01";
function historialEstimado(state,seccion){
  const dentro=cat=>seccion==="todo"||seccionDe(cat)===seccion;
  const hoy=new Date().toISOString().split("T")[0];
  const ms=d=>new Date(d+"T00:00:00Z").getTime();
  const tramos=[], ventas=[];
  const prod={};for(const p of state.products||[]) prod[p.id]=p;
  for(const p of state.products||[]){
    if(!dentro(p.categoria)) continue;
    let d0=p.fechaCompra||p.lanzamiento||HIST_INICIO; if(d0<HIST_INICIO) d0=HIST_INICIO; if(d0>hoy) d0=hoy;
    const c=p.precioCompra||0;
    if(p.stock>0) tramos.push({a:d0,b:null,c:c*p.stock,v:(p.valorMercado||c)*p.stock});
  }
  for(const m of state.movements||[]){
    if(m.tipo!=="Venta"||!m.fecha) continue;
    const p=m.productoId!=null?prod[m.productoId]:null;
    const cat=p?p.categoria:(m.categoriaVenta||"PS5"); if(!dentro(cat)) continue;
    const q=m.cantidad||1, c=(m.historico?(m.coste||0):(p?p.precioCompra||0:0));
    let d0=p?(p.fechaCompra||p.lanzamiento||HIST_INICIO):null;
    if(!d0||d0>m.fecha){const x=new Date(ms(m.fecha)-45*864e5).toISOString().split("T")[0];d0=x;}
    if(d0<HIST_INICIO) d0=HIST_INICIO;
    tramos.push({a:d0,b:m.fecha,c:c*q,v:(m.precioVenta||0)*q});
    ventas.push({d:m.fecha,ing:(m.precioVenta||0)*q,ben:((m.precioVenta||0)-c)*q-(m.ebayFee||0)});
  }
  if(seccion==="cartas"||seccion==="todo") for(const p of state.pokemon||[]){const u=p.unidades||1;tramos.push({a:HIST_INICIO,b:null,c:(p.precioCompra||0)*u,v:(p.precioMercado||p.precioCompra||0)*u});}
  const fechas=[];let y=2023,mo=7;while(true){const d=`${y}-${String(mo).padStart(2,"0")}-01`;if(d>hoy)break;fechas.push(d);mo++;if(mo>12){mo=1;y++;}}
  fechas.push(hoy);
  return fechas.map(d=>{
    const t=ms(d);let inv=0,vm=0,ing=0,ben=0;
    for(const r of tramos){if(d<r.a||(r.b&&d>=r.b)) continue;const fin=ms(r.b||hoy),ini=ms(r.a);const k=fin>ini?Math.min(1,Math.max(0,(t-ini)/(fin-ini))):1;inv+=r.c;vm+=r.c+(r.v-r.c)*k;}
    for(const v of ventas) if(v.d<=d){ing+=v.ing;ben+=v.ben;}
    return {d,inv:Math.round(inv),vm:Math.round(vm),ing:Math.round(ing),ben:Math.round(ben),est:true};
  });
}

  if(!(p.stock>0)||!(p.precioCompra>0)||!(p.valorMercado>0)) return null;

  const ph=(p.priceHistory||[]).map(h=>h.price).filter(v=>v>0);
  const pico=ph.length>=3&&p.valorMercado>=Math.max(...ph)&&x>=1.5;
  if(x>=3) return {x,motivo:pico?`x${x.toFixed(1)} y en su máximo`:`x${x.toFixed(1)} sobre coste`};
  if(pico) return {x,motivo:`en su máximo (x${x.toFixed(1)})`};
  return null;
};

const nrm=t=>(" "+String(t||"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-z0-9]+/g," ")+" ");
// Grupos de palabras: si el producto lleva una, el anuncio tiene que llevarla; si el anuncio la lleva y el producto no, es otra cosa
const GRUPOS_ED=[
  ["expansion","dlc"],["pass","pase"],["bundle","pack","lote","lot"],["complete","completa","completo","goty"],
  ["collection","coleccion"],["trilogy","trilogia"],["dual","twin","doble","double"],["collector","collectors","coleccionista"],

];
const ESPECIALES=[7,8,9,10,11,12]; // collector, signature, premium, deluxe, steelbook, limited
const PAREJAS=[["diamante brillante","perla reluciente","brilliant diamond","shining pearl"],["escarlata","purpura","scarlet","violet"],["espada","escudo","sword","shield"],["lets go pikachu","lets go eevee"]];
const BASURA=/ \d ?ivs? | ivs | shiny | vaina | compendium | solo caja | caja vacia | empty box | sin juego | no game | solo manual | manual only | codigo | code only | amiibo card | carta | runas | runes | in game | wata | vga | ukg | cgc | graded | calificado | grado \d+ /;
// Ediciones con nombre propio (Divine, Grimoire, Midnight Channel...) que no son la que tienes
const ED_OK=new Set(["standard","estandar","normal","launch","lanzamiento","day","one","pal","uk","eu","eur","euro","english","japanese","japonesa","japon","espanola","espana","oficial","fisica","physical","first","primera","1a","juego","game","the","de","la","el","nueva","new","usa","us","asian","asia","import","importacion","reprint"]);
const VARIANTE=/ variant | variante | sdcc | foil | lamina | lrg | limited run | midnight channel | grimoire /;
const PLAT_SONY=/ ps4 | ps5 | playstation | xbox /, PLAT_NIN=/ nintendo | switch /;
const tiene=(t,w)=>t.includes(" "+w+" ");
function refinarPrecio(prod,data){
  const L=(data&&data.listings)||[];
  if(!L.length) return {mediana:(data&&(data.mediana??data.median))||0,min:(data&&data.min)||0,max:(data&&data.max)||0,count:(data&&data.count)||0,listings:L};
  const nom=nrm(`${prod.nombre} ${prod.edicion&&!/^(est[áa]ndar|standard|normal)$/i.test(prod.edicion)?prod.edicion:""} ${prod.categoria==="Steelbook"?"steelbook":""}`);
  const especial=ESPECIALES.some(gi=>GRUPOS_ED[gi].some(w=>tiene(nom,w)));
  const ok=L.filter(l=>{
    const t=nrm(l.title);
    if(BASURA.test(t)) return false;
    if(VARIANTE.test(t)&&!VARIANTE.test(nom)) return false;
    const cat=prod.categoria||"";
    if((cat==="PS4"||cat==="PS5")&&PLAT_NIN.test(t)&&!PLAT_SONY.test(t)) return false;
    if((cat==="Switch"||cat==="Switch 2")&&PLAT_SONY.test(t)&&!PLAT_NIN.test(t)) return false;
    const eds=[...t.matchAll(/ ([a-z0-9]+) edition /g)].map(x=>x[1]).concat([...t.matchAll(/ edicion ([a-z0-9]+) /g)].map(x=>x[1]));
    if(eds.some(w=>!ED_OK.has(w)&&!tiene(nom,w)&&!GRUPOS_ED.some(g=>g.includes(w)&&g.some(x=>tiene(nom,x))))) return false;
    for(let gi=0;gi<GRUPOS_ED.length;gi++){
      const g=GRUPOS_ED[gi];
      const enNom=g.some(w=>tiene(nom,w)), enAnu=g.some(w=>tiene(t,w));
      if(enNom&&!enAnu) return false;
      // Un anuncio de edicion especial no vale para la estandar; entre especiales los vendedores mezclan nombres
      if(!enNom&&enAnu&&!(ESPECIALES.includes(gi)&&especial)) return false;
    }
    for(const par of PAREJAS){
      const mios=par.filter(w=>nom.includes(" "+w+" "));
      if(mios.length&&par.some(w=>!mios.includes(w)&&t.includes(" "+w+" "))) return false;
    }
    return true;
  });
  const med=a=>{const s=[...a].sort((x,y)=>x-y);const m=Math.floor(s.length/2);return s.length?(s.length%2?s[m]:(s[m-1]+s[m])/2):0;};
  // Fuera precios absurdos: referencia la mediana baja, valen entre 0,3x y 3x
  const base=ok.map(l=>+l.price||0).filter(x=>x>0).sort((x,y)=>x-y);
  const ref=base.length?base[Math.floor((base.length-1)/2)]:0;
  const vale=x=>x>0&&x>=ref*0.3&&x<=ref*3;
  const pr=ok.map(l=>+l.price||0).filter(vale);
  const lst=ok.filter(l=>vale(+l.price||0));
  return {mediana:Math.round(med(pr)*100)/100,min:pr.length?Math.min(...pr):0,max:pr.length?Math.max(...pr):0,count:pr.length,listings:lst};
}

/* ── Guardado protegido ──
   Cada guardado lleva savedAt. Antes de escribir se mira el savedAt que hay en la nube:
   si no es el que esta pestana cargo o escribio, otro dispositivo o pestana ha guardado despues
   y esta copia esta desfasada, asi que NO se escribe y se avisa para recargar. */
const SYNC={base:null,bloqueo:null,ultimo:"",onBloqueo:null,enCurso:false,pendiente:null};
const bloquearSync=(motivo)=>{if(SYNC.bloqueo)return;SYNC.bloqueo=motivo;SYNC.onBloqueo&&SYNC.onBloqueo(motivo);};
async function remotoSavedAt(userId){
  const {data,error}=await sb.from("gsp_data").select("s:data->>savedAt").eq("user_id",userId).maybeSingle();
  if(error) throw error;
  return data?data.s||null:undefined; // undefined = no hay fila todavia
}
async function guardar(state,{forzar=false}={}){
  if(SYNC.bloqueo&&!forzar) return false;
  if(!state||!state.products) return false;
  const {savedAt,...limpio}=state;
  const json=JSON.stringify(limpio);
  if(json===SYNC.ultimo&&!forzar) return true;
  if(SYNC.enCurso){SYNC.pendiente=state;return false;}
  SYNC.enCurso=true;
  try{
    let {data:{session}}=await sb.auth.getSession();
    if(!session||(session.expires_at&&session.expires_at*1000<Date.now()+60000)){
      const r=await sb.auth.refreshSession();session=r.data.session;
    }
    if(!session?.user) return false;
    const uid=session.user.id;
    if(!forzar){
      const rem=await remotoSavedAt(uid);
      if(rem!==undefined&&rem!==null&&SYNC.base!==null&&rem!==SYNC.base){bloquearSync("otro");return false;}
      if(rem!==undefined&&rem!==null&&SYNC.base===null){bloquearSync("otro");return false;}
    }
    const nuevo=new Date().toISOString();
    const escribir=async()=>sb.from("gsp_data").upsert({user_id:uid,data:{...limpio,savedAt:nuevo}},{onConflict:"user_id"}).select("user_id");
    let {data,error}=await escribir();
    if(error||!data||!data.length){ // token caducado: Supabase devuelve exito con 0 filas
      await sb.auth.refreshSession();
      ({data,error}=await escribir());
      if(error||!data||!data.length) return false;
    }
    SYNC.base=nuevo;SYNC.ultimo=json;
    return true;
  }catch(e){return false;}
  finally{
    SYNC.enCurso=false;
    if(SYNC.pendiente){const p=SYNC.pendiente;SYNC.pendiente=null;setTimeout(()=>guardar(p),500);}
  }
}

/* ── Copias automaticas en este dispositivo (IndexedDB), una por semana, se guardan las 8 ultimas ── */
const COPIAS={
  db(){return new Promise((ok,ko)=>{const r=indexedDB.open("gsp_copias",1);r.onupgradeneeded=()=>r.result.createObjectStore("c");r.onsuccess=()=>ok(r.result);r.onerror=()=>ko(r.error);});},
  async lista(){try{const db=await this.db();return await new Promise(ok=>{const t=db.transaction("c").objectStore("c").getAllKeys();t.onsuccess=()=>ok((t.result||[]).sort().reverse());t.onerror=()=>ok([]);});}catch(e){return [];}},
  async leer(k){const db=await this.db();return await new Promise((ok,ko)=>{const t=db.transaction("c").objectStore("c").get(k);t.onsuccess=()=>ok(t.result);t.onerror=()=>ko(t.error);});},
  async guardar(k,v){const db=await this.db();return await new Promise((ok,ko)=>{const t=db.transaction("c","readwrite");t.objectStore("c").put(v,k);t.oncomplete=()=>ok();t.onerror=()=>ko(t.error);});},
  async borrar(k){const db=await this.db();return await new Promise(ok=>{const t=db.transaction("c","readwrite");t.objectStore("c").delete(k);t.oncomplete=()=>ok();t.onerror=()=>ok();});},
  async semanal(state){
    try{
      if(!state?.products?.length) return;
      const ks=await this.lista();
      const sem=ks.filter(k=>/^\d{4}-\d\d-\d\d$/.test(k));
      const hoy=new Date().toISOString().split("T")[0];
      if(sem[0]&&(Date.now()-new Date(sem[0]).getTime())<6.5*864e5) return;
      await this.guardar(hoy,JSON.stringify(state));
      for(const k of sem.slice(7)) await this.borrar(k);
      for(const k of ks.filter(k=>!/^\d{4}-\d\d-\d\d$/.test(k)).slice(4)) await this.borrar(k);
    }catch(e){}
  },
};

/* Gráfica SVG de historial de precios */
function PriceChart({history,color="var(--accent2)"}){
  if(!history||history.length<2) return(
    <div style={{textAlign:"center",padding:"24px 0",color:"var(--text3)",fontSize:12}}>Sin suficientes datos de historial</div>
  );
  const W=320,H=90,pad=6;
  const prices=history.map(h=>h.price);
  const min=Math.min(...prices);
  const max=Math.max(...prices);
  const range=max-min||1;
  const pts=history.map((h,i)=>{
    const x=pad+(i/(history.length-1))*(W-pad*2);
    const y=H-pad-(h.price-min)/range*(H-pad*2);
    return [x,y];
  });
  const path="M"+pts.map(p=>p.join(",")).join(" L");
  const areaPath=path+` L${pts[pts.length-1][0]},${H} L${pts[0][0]},${H} Z`;
  return(
    <div style={{overflowX:"auto"}}>
      <svg viewBox={`0 0 ${W} ${H}`} style={{width:"100%",maxWidth:W,display:"block"}}>
        <defs>
          <linearGradient id="pg" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stopColor={color} stopOpacity="0.15"/>
            <stop offset="100%" stopColor={color} stopOpacity="0"/>
          </linearGradient>
        </defs>
        <path d={areaPath} fill="url(#pg)"/>
        <path d={path} stroke={color} strokeWidth="2" fill="none" strokeLinecap="round" strokeLinejoin="round"/>
        {pts.map((p,i)=>(
          <circle key={i} cx={p[0]} cy={p[1]} r="3" fill={color}/>
        ))}
        <text x={pts[0][0]} y={H-1} fontSize="8" fill="var(--text3)" textAnchor="start">{history[0].date.slice(5)}</text>
        <text x={pts[pts.length-1][0]} y={H-1} fontSize="8" fill="var(--text3)" textAnchor="end">{history[history.length-1].date.slice(5)}</text>
        <text x={W-2} y={pts[pts.length-1][1]-4} fontSize="9" fill={color} textAnchor="end" fontWeight="700">{fmt(prices[prices.length-1])}€</text>
      </svg>
    </div>
  );
}

/* Buscador integrado */
function GameSearcher({onSelect,onClose}){
  const [q,setQ]=useState("");
  const [results,setResults]=useState([]);
  const [loading,setLoading]=useState(false);
  const [error,setError]=useState(null);
  const timerRef=useRef(null);

  useEffect(()=>{
    if(q.length<3){setResults([]);return;}
    clearTimeout(timerRef.current);
    timerRef.current=setTimeout(async()=>{
      setLoading(true);setError(null);
      try{
        const r=await fetch(`${WORKER}/search?q=${encodeURIComponent(q)}`);
        if(!r.ok) throw new Error("Error en búsqueda");
        const data=await r.json();
        setResults((data||[]).map(g=>({
          nombre: g.name||g.nombre||"",
          plataforma: (g.platforms&&g.platforms[0])?g.platforms[0].name:(g.plataforma||""),
          año: g.first_release_date?new Date(g.first_release_date*1000).getFullYear():(g.año||""),
          sku: g.id||"",
          cover: g.cover||null
        })));
      }catch(e){setError("Error al buscar. Comprueba conexión.");setResults([]);}
      finally{setLoading(false);}
    },500);
    return()=>clearTimeout(timerRef.current);
  },[q]);

  return(
    <Sheet onClose={onClose} title="Buscar juego">
      <Field label="Nombre del juego">
        <input autoFocus value={q} onChange={e=>setQ(e.target.value)}
          placeholder="Ej: Silent Hill 2 Collector..." style={S.inp()}/>
      </Field>
      {loading&&<div style={{textAlign:"center",padding:16,color:"var(--accent2)",fontSize:13}}>
        <span className="spin" style={{display:"inline-block"}}><Ico d={I.refrescar}/></span> Buscando…
      </div>}
      {error&&<div style={{padding:10,background:"var(--red2)",borderRadius:8,color:"var(--red)",fontSize:12,marginBottom:8}}>{error}</div>}
      {results.length>0&&(
        <div style={{border:"1px solid var(--border)",borderRadius:12,overflow:"hidden",maxHeight:340,overflowY:"auto"}}>
          {results.map((r,i)=>(
            <button key={i} onClick={()=>onSelect(r)}
              style={{...S.row,alignItems:"center",gap:10,padding:"10px 14px"}}
              onMouseEnter={e=>e.currentTarget.style.background="var(--bg3)"}
              onMouseLeave={e=>e.currentTarget.style.background="transparent"}>
              {r.cover
                ?<img src={r.cover} alt="" style={{width:36,height:48,objectFit:"cover",borderRadius:4,flexShrink:0}}/>
                :<div style={{width:36,height:48,background:"var(--bg3)",borderRadius:4,flexShrink:0,display:"flex",alignItems:"center",justifyContent:"center",fontSize:16}}></div>
              }
              <div style={{flex:1,minWidth:0,textAlign:"left"}}>
                <div style={{fontWeight:700,fontSize:13,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{r.nombre}</div>
                <div style={{fontSize:11,color:"var(--text3)",marginTop:2}}>{r.plataforma||r.categoria||""} {r.año?`· ${r.año}`:""}</div>
              </div>
            </button>
          ))}
        </div>
      )}
      {q.length>=3&&!loading&&results.length===0&&!error&&(
        <div style={{padding:20,textAlign:"center",color:"var(--text3)",fontSize:13}}>Sin resultados para "{q}"</div>
      )}
    </Sheet>
  );
}

const ORDENES=[["lanz","Más nuevos"],["lanzA","Más antiguos"],["valor","Valor"],["mult","Mejor ×"],["ganancia","Ganancia €"],["vender","Para vender"],["coste","Coste"],["uds","Unidades"],["nombre","A-Z"]];
function ordenar(l,o){
  const v=p=>p.valorMercado||p.precioCompra||0, g=p=>(v(p)-(p.precioCompra||0))*(p.stock||0), m=p=>p.precioCompra>0?v(p)/p.precioCompra:0;
  const f=p=>p.lanzamiento||p.fechaCompra||"";
  const c={lanz:(a,b)=>(f(b)||"0").localeCompare(f(a)||"0"),lanzA:(a,b)=>(f(a)||"9").localeCompare(f(b)||"9"),valor:(a,b)=>v(b)-v(a),mult:(a,b)=>m(b)-m(a),
    ganancia:(a,b)=>g(b)-g(a),vender:(a,b)=>((b.stock>1?1:0)-(a.stock>1?1:0))||(m(b)-m(a)),coste:(a,b)=>(b.precioCompra||0)-(a.precioCompra||0),
    uds:(a,b)=>(b.stock||0)-(a.stock||0)||v(b)-v(a),nombre:(a,b)=>a.nombre.localeCompare(b.nombre,"es")}[o]||(()=>0);
  return [...l].sort(c);
}

        </div>)}
      </div>}
    </div>
    {lejos&&<div style={{...S.card,padding:"10px 14px",marginBottom:10,fontSize:12.5,color:"var(--text2)"}}>Envío más lejano: <b style={{color:"var(--text)"}}>{lejos.ciudad} ({lejos.pais})</b>. Cobrado en total, con envío: <b style={{color:"var(--text)"}}>{H(`${fmt(total)} €`)}</b>.</div>}
    <div style={{...S.card,overflow:"hidden"}}>
      {porPais.map(x=>(
        <button key={x.pais} onClick={()=>irPais(x.pais)} style={{...S.row,background:paisSel===x.pais?"var(--accent3)":"transparent",color:"var(--text)"}}>
          <div style={{flex:1,fontWeight:600,fontSize:13}}>{x.pais}</div>
          <div style={{fontSize:12,color:"var(--text3)",width:70,textAlign:"right"}}>{x.n} {x.n===1?"envío":"envíos"}</div>
          <div style={{fontFamily:"var(--display)",fontSize:13,width:90,textAlign:"right"}}>{H(`${fmt(x.tot)} €`)}</div>
        </button>))}
    </div>
  </div>);
}

  const [seccion,setSeccionRaw]=useState(()=>{try{return localStorage.getItem("gsp_seccion")||"juegos";}catch(e){return "juegos";}});

  const catVenta=m=>m.historico?(m.categoriaVenta||""):((state.products.find(p=>p.id===m.productoId)||{}).categoria||"");
  const ventasTodas=state.movements.filter(m=>m.tipo==="Venta");
  const enSec=cat=>seccion==="todo"||seccionDe(cat)===seccion;
  const ventas=ventasTodas.filter(m=>enSec(catVenta(m)));
  const prodsS=state.products.filter(p=>enSec(p.categoria));
  const reservasOrd=useMemo(()=>[...state.reservas]
    .sort((a,b)=>(a.lanzamiento||"9999").localeCompare(b.lanzamiento||"9999")),[state.reservas]);
  const reservasActivas=useMemo(()=>reservasOrd.filter(r=>!r.enStock&&(!r.lanzamiento||diasHasta(r.lanzamiento)>=-7)),[reservasOrd]);
  // Reservas cuyo lanzamiento ya ha llegado y aun no estan en stock
  const salidas=useMemo(()=>reservasOrd.filter(r=>!r.enStock&&r.lanzamiento&&diasHasta(r.lanzamiento)<=0&&r.posponer!==today),[reservasOrd]);
  const reservasPasadas=useMemo(()=>reservasOrd.filter(r=>diasHasta(r.lanzamiento)<-7),[reservasOrd]);

  const kpi=useMemo(()=>{
    let inv=prodsS.reduce((a,p)=>a+p.stock*p.precioCompra,0);
    let vm=prodsS.reduce((a,p)=>a+p.stock*(p.valorMercado||p.precioCompra),0);
    let ing=ventas.reduce((a,m)=>a+(m.precioVenta||0)*m.cantidad,0);
    const costeDe=m=>m.historico?(m.coste||0):((state.products.find(p=>p.id===m.productoId)||{}).precioCompra||0);
    let cv=ventas.reduce((a,m)=>a+costeDe(m)*m.cantidad,0);
    let fees=ventas.reduce((a,m)=>a+(m.ebayFee||0),0);
    if(seccion==="cartas"||seccion==="todo"){ // lo apuntado en la coleccion Pokemon tambien es de cartas
      const pk=state.pokemon||[], pv=state.pokemonVentas||[];
      inv+=pk.reduce((a,p)=>a+(p.precioCompra||0)*(p.unidades||1),0);
      vm+=pk.reduce((a,p)=>a+(p.precioMercado||p.precioCompra||0)*(p.unidades||1),0);
      ing+=pv.reduce((a,v)=>a+(v.precioVenta||0)*(v.unidades||1),0);
      cv+=pv.reduce((a,v)=>a+(v.coste||0)*(v.unidades||1),0);
      fees+=pv.reduce((a,v)=>a+(v.fee||0),0);
    }
    const ben=ing-cv-fees;
    const roi=cv>0?ben/cv*100:0;
    // Dinero propio: lo gastado en total menos lo cobrado neto, más lo que hayas sacado
    const cap=state.capital||{};
    const ret=(seccion==="juegos"||seccion==="todo")?(cap.retiradas||[]).reduce((a,r)=>a+(+r.importe||0),0):0;
    const propio=inv-ben+ret;
    const inicio=cap.inicio||"2024-10-01";
    const anos=Math.max((Date.now()-new Date(inicio).getTime())/(365.25*864e5),0.1);
    const finalV=vm+ret;
    const gProp=finalV-propio;
    const pProp=propio>0?gProp/propio*100:0;
    const aProp=propio>0&&finalV>0?(Math.pow(finalV/propio,1/anos)-1)*100:0;
    return{inv,vm,ing,ben,roi,margen:ing>0?ben/ing*100:0,stock:prodsS.reduce((a,p)=>a+p.stock,0),
      propio,ret,gProp,pProp,aProp,anos,inicio};
  },[state,ventas,seccion]);

  const catStats=useMemo(()=>Object.keys(CAT_CONFIG).filter(cat=>enSec(cat)).map(cat=>{
    const prods=state.products.filter(p=>p.categoria===cat);
    const vCat=ventas.filter(m=>(m.historico?m.categoriaVenta:(state.products.find(p=>p.id===m.productoId)?.categoria||""))===cat);
    const ing=vCat.reduce((a,m)=>a+(m.precioVenta||0)*m.cantidad,0);
    const cv=vCat.reduce((a,m)=>a+((m.historico?(m.coste||0):((state.products.find(p=>p.id===m.productoId)||{}).precioCompra||0))*m.cantidad)+(m.ebayFee||0),0);
    return{cat,refs:prods.length,uds:prods.reduce((a,p)=>a+p.stock,0),
      inv:prods.reduce((a,p)=>a+p.stock*p.precioCompra,0),
      vm:prods.reduce((a,p)=>a+p.stock*(p.valorMercado||p.precioCompra),0),
      ing,ben:ing-cv,nVentas:vCat.length};
  }),[state,ventas,seccion]);

  const paraVender=useMemo(()=>prodsS.map(p=>({p,m:momentoVenta(p)})).filter(x=>x.m)
    .sort((a,b)=>(b.p.valorMercado-b.p.precioCompra)*b.p.stock-(a.p.valorMercado-a.p.precioCompra)*a.p.stock),[state.products,seccion]);
  const oportunidades=useMemo(()=>
    prodsS.filter(p=>p.valorMercado>0&&p.valorMercado>p.precioCompra*1.5&&p.stock>0)
      .sort((a,b)=>(b.valorMercado-b.precioCompra)-(a.valorMercado-a.precioCompra)),
  [state.products,seccion]);

  const catProducts=useMemo(()=>{
    if(nav.screen!=="categoria") return [];
    const l=state.products.filter(p=>p.categoria===nav.data&&
      (!search||p.nombre.toLowerCase().includes(search.toLowerCase())||p.sku.toLowerCase().includes(search.toLowerCase())));
    return ordenar(l,orden);
  },[nav,state.products,search,orden]);

  /* ── eBay price fetch ── */
  const fetchEbayPrice=useCallback(async(product,soloSubir)=>{
    setLoadingEbay(product.id);
    try{
      const r=await fetch(`${WORKER}/price?q=${encodeURIComponent(product.nombre)}&cat=${encodeURIComponent(product.categoria)}&region=${encodeURIComponent(product.region||"PAL ESP")}&edicion=${encodeURIComponent(product.edicion&&product.edicion!=="Estándar"?product.edicion:"")}`);
      if(!r.ok) throw new Error("Error eBay");

      if(soloSubir!==true) showToast(rf.mediana>0?`Precio eBay: ${fmt(rf.mediana)} €`:"Sin anuncios que encajen");
    }catch(e){showToast("Error al obtener precio eBay","var(--red)");}
    finally{setLoadingEbay(null);}
  },[]);

  const fetchCover=useCallback(async(product)=>{
    try{
      const r=await fetch(`${WORKER}/search?q=${encodeURIComponent(product.nombre)}`);
      if(!r.ok) throw new Error();
      const data=await r.json();
      // Find best match
      const match=(data||[]).find(g=>{
        const nameLower=g.name.toLowerCase();
        const prodLower=product.nombre.toLowerCase().replace(/[–—]/g,'-');
        return nameLower.includes(prodLower.split(' ')[0].toLowerCase());
      })||(data&&data[0]);
      if(match?.cover){
        dispatch({type:"UPDATE_PRODUCT",payload:{...product,cover:match.cover}});
        showToast("✓ Portada encontrada");
      } else {
        showToast("Sin portada en IGDB","var(--yellow)");
      }
    }catch(e){showToast("Error buscando portada","var(--red)");}
  },[state.products]);

  /* ── Auto update all prices ── */
  const stateRef=useRef(state); stateRef.current=state;
  const subirNube=async()=>{await guardar(stateRef.current);};
  const updateAllPrices=useCallback(async(auto,sec)=>{
    const S0=sec||(seccion==="todo"?"juegos":seccion);
    const hace6=Date.now()-6*864e5;
    // En la pasada semanal automatica no se tocan los valores puestos a mano, de vendidos ni de StockX,
    // y se salta lo ya actualizado esta semana (por si la pasada anterior se corto)
    const lista=stateRef.current.products.filter(p=>p.stock>0&&seccionDe(p.categoria)===S0&&
      !(auto===true&&(["ebay-vendidos-es","manual","stockx"].includes(p.valorFuente)||(p.ebayData?.fetchedAt&&new Date(p.ebayData.fetchedAt).getTime()>hace6))));
    if(!lista.length){if(auto!==true) showToast("No hay productos con stock");return true;}
    setUpdateProgress({current:0,total:lista.length});
    let subidos=0,igual=0,sinDatos=0;
    for(let i=0;i<lista.length;i++){
      const p=lista[i];
      try{
        const ed=p.edicion&&!/^(est[\u00e1a]ndar|standard|normal)$/i.test(p.edicion)?p.edicion:"";
        const r=await fetch(`${WORKER}/price?q=${encodeURIComponent(p.nombre)}&cat=${encodeURIComponent(p.categoria||"")}&region=${encodeURIComponent(p.region||"PAL ESP")}&edicion=${encodeURIComponent(ed)}`);
        if(r.ok){
          const data=await r.json();
          const rf=refinarPrecio(p,data);
          const med=rf.mediana;
          if(med>0){
            dispatch({type:"UPDATE_EBAY",payload:{id:p.id,soloSubir:true,ebayData:{...rf,fetchedAt:new Date().toISOString()}}});
            if(med>(p.valorMercado||0)) subidos++; else igual++;
          } else sinDatos++;
        } else sinDatos++;
      }catch(e){sinDatos++;}
      setUpdateProgress({current:i+1,total:lista.length});
      await new Promise(res=>setTimeout(res,800));
      if((i+1)%40===0) await subirNube();
    }
    setUpdateProgress(null);
    await new Promise(res=>setTimeout(res,600));
    await subirNube();
    showToast(`${subidos} al alza \u00b7 ${igual} sin cambio \u00b7 ${sinDatos} sin datos`);
    return true;
  },[state.products,seccion]);

  /* ── Auto update all covers ── */
  const [coverProgress,setCoverProgress]=useState(null);
  const updateAllCovers=useCallback(async()=>{
    const noCover=state.products.filter(p=>!p.cover&&p.stock>0&&seccionDe(p.categoria)==="juegos");
    if(noCover.length===0){showToast("✓ Todos los productos ya tienen portada");return;}
    setCoverProgress({current:0,total:noCover.length});
    let found=0;
    for(let i=0;i<noCover.length;i++){
      const p=noCover[i];
      try{
        const r=await fetch(`${WORKER}/search?q=${encodeURIComponent(p.nombre.split(/[–—:]/)[0].trim())}`);
        if(r.ok){
          const data=await r.json();
          const match=(data||[]).find(g=>g.cover)||(data&&data[0]);
          if(match?.cover){
            dispatch({type:"UPDATE_PRODUCT",payload:{...p,cover:match.cover}});
            found++;
          }
        }
      }catch(e){}
      setCoverProgress({current:i+1,total:noCover.length});
      await new Promise(res=>setTimeout(res,400));
    }
    setCoverProgress(null);
    showToast(`✓ ${found} portadas encontradas de ${noCover.length}`);
  },[state.products]);

  /* ── Radar news fetch ── */
  const fetchRadarNews=useCallback(async(tab)=>{
    setRadarLoading(true);
    try{
      const r=await fetch(`${WORKER}/radar/news?tab=${tab||"all"}`);
      if(!r.ok) throw new Error();
      const data=await r.json();
      setRadarNews((data||[]).map((n,i)=>({
        id: n.id||n.link||String(i),
        titulo: n.title||n.titulo||"",
        fecha: n.date||n.fecha||"",
        fuente: n.source||n.fuente||"",
        link: n.link||""
      })));
    }catch(e){setRadarNews([]);}
    setRadarLoading(false);
  },[]);

  const fetchWorth=useCallback(async(noticia)=>{
    const id=noticia.id;
    setWorthData(prev=>({...prev,[id]:{loading:true,result:null}}));
    try{
      const q=encodeURIComponent(noticia.titulo.slice(0,80));
      const r=await fetch(`${WORKER}/radar/worth?q=${q}&precio=0`);
      if(!r.ok) throw new Error();
      const data=await r.json();
      setWorthData(prev=>({...prev,[id]:{loading:false,result:data}}));
    }catch(e){
      setWorthData(prev=>({...prev,[id]:{loading:false,result:null}}));
    }
  },[]);

  useEffect(()=>{if(tab==="radar") fetchRadarNews(radarTab);},[tab,radarTab]);

  /* ── Auth + Supabase sync ── */
  useEffect(()=>{
    // Check session on load
    sb.auth.getSession().then(({data:{session}})=>{
      if(session?.user){
        setUser(session.user);
        // Load data from Supabase
        loadFromSupabase(session.user.id).then(remoteData=>{
          if(remoteData&&remoteData.products&&remoteData.products.length>0){
            // Use remote data — save to localStorage and dispatch to state
            SYNC.base=remoteData.savedAt||null;SYNC.ultimo="";localStorage.setItem(LS_KEY,JSON.stringify(remoteData));
            dispatch({type:"LOAD_STATE",payload:remoteData});
          } else {
            // No remote data — upload local if exists
            const local=loadState();
            if(local&&local.products) guardar(local,{forzar:true});
          }
          setAuthLoading(false);
        });
      } else {
        setAuthLoading(false);
      }
    });
    // Listen for auth changes
    const {data:{subscription}}=sb.auth.onAuthStateChange((_event,session)=>{
      setUser(session?.user||null);
    });
    return()=>subscription.unsubscribe();
  },[]);

  // Guardado en la nube: 3 s despues del ultimo cambio, y solo si esta copia no esta desfasada
  const [syncBloqueo,setSyncBloqueo]=useState(null);
  useEffect(()=>{SYNC.onBloqueo=m=>setSyncBloqueo(m);},[]);
  useEffect(()=>{
    if(!user||authLoading) return;
    const t=setTimeout(()=>guardar(state),3000);
    return()=>clearTimeout(t);
  },[user,authLoading,state]);
  // Otra pestana abierta: la nueva avisa y las anteriores dejan de guardar
  useEffect(()=>{
    let bc;try{bc=new BroadcastChannel("gsp");}catch(e){return;}
    const yo=Math.random().toString(36).slice(2);
    bc.onmessage=ev=>{if(ev.data&&ev.data.t==="hola"&&ev.data.id!==yo) bloquearSync("pestana");};
    bc.postMessage({t:"hola",id:yo});
    return()=>bc.close();
  },[]);
  // Al volver a la app, comprobar si otro dispositivo ha guardado mientras tanto
  useEffect(()=>{
    if(!user) return;
    const mirar=async()=>{
      if(document.visibilityState!=="visible"||SYNC.bloqueo||SYNC.base===null) return;
      try{const r=await remotoSavedAt(user.id);if(r&&r!==SYNC.base) bloquearSync("otro");}catch(e){}
    };
    document.addEventListener("visibilitychange",mirar);
    return()=>document.removeEventListener("visibilitychange",mirar);
  },[user]);
  // Foto diaria del valor por seccion para la grafica de evolucion
  useEffect(()=>{
    if(!user||authLoading||!state.products.length) return;
    const t=setTimeout(()=>{
      const d=new Date().toISOString().split("T")[0];
      const tot=totalesSeccion(stateRef.current);
      const h=stateRef.current.historial||[];
      const ult=h[h.length-1];
      if(ult&&ult.d===d&&JSON.stringify({...ult,d:0})===JSON.stringify({...tot,d:0})) return;
      dispatch({type:"SET_HIST",payload:{d,...tot}});
    },5000);
    return()=>clearTimeout(t);
  },[user,authLoading,state.products,state.pokemon]);
  // Resumen semanal: la primera vez que abres la app cada semana, si hay al menos 6 dias de historial
  useEffect(()=>{
    if(!user||authLoading||!state.products.length) return;
    const t=setTimeout(()=>{
      const hoy=new Date();
      const lunes=new Date(hoy);lunes.setDate(hoy.getDate()-((hoy.getDay()+6)%7));
      const semana=lunes.toISOString().split("T")[0];
      if(stateRef.current.resumenVisto===semana) return;
      (async()=>{
      // 1) precios de los juegos una vez por semana, antes del resumen
      if(stateRef.current.preciosSemana!==semana){
        showToast("Actualizando los precios de la semana, deja la app abierta");
        const ok=await updateAllPrices(true,"juegos");
        if(!ok) return;
        dispatch({type:"SET_FLAGS",payload:{}});
        dispatch({type:"SET_PRECIOS_SEMANA",payload:semana});
        await new Promise(r=>setTimeout(r,800));
      }
      // 2) resumen con los valores ya actualizados
      const st=stateRef.current;
      const h=st.historial||[];
      const hace7=new Date(Date.now()-7*864e5).toISOString().split("T")[0];
      const base=[...h].reverse().find(e=>e.d<=hace7);
      if(!base) return;
      const ult={d:today,...totalesSeccion(st)};
      dispatch({type:"SET_HIST",payload:ult});
      const secs=SECCIONES.map(x=>({k:x.k,l:x.l,ahora:ult[x.k]?ult[x.k][1]:0,antes:base[x.k]?base[x.k][1]:0})).map(x=>({...x,dif:x.ahora-x.antes}));
      const vs=st.movements.filter(m=>m.tipo==="Venta"&&(m.fecha||"")>hace7);
      const costeDe=m=>m.historico?(m.coste||0):((st.products.find(p=>p.id===m.productoId)||{}).precioCompra||0);
      const ing=vs.reduce((a,m)=>a+(m.precioVenta||0)*m.cantidad,0);
      const ben=ing-vs.reduce((a,m)=>a+costeDe(m)*m.cantidad+(m.ebayFee||0),0);
      const vender=st.products.map(p=>({p,m:momentoVenta(p)})).filter(x=>x.m).sort((a,b)=>(b.p.valorMercado-b.p.precioCompra)*b.p.stock-(a.p.valorMercado-a.p.precioCompra)*a.p.stock).slice(0,5);
      setResumen({desde:base.d,secs,nVentas:vs.length,ing,ben,vender});
      setModal("resumen");
      dispatch({type:"SET_RESUMEN_VISTO",payload:semana});
      try{
        if("Notification" in window&&Notification.permission==="granted"&&navigator.serviceWorker){
          const tot=secs.reduce((a,x)=>a+x.dif,0);
          navigator.serviceWorker.ready.then(reg=>reg.showNotification("Resumen de la semana",{body:`La colección ${tot>=0?"sube":"baja"} ${fmt(Math.abs(tot))} € esta semana · ${vender.length} para vender`,tag:"resumen-"+semana}));
        }
      }catch(e){}

            const col={juegos:"var(--accent2)",zapatillas:"#db2777",cartas:"#0891b2"};
            return(
            <div style={{...S.card,padding:"14px 16px",marginBottom:10}}>
              <div style={{fontSize:10.5,fontWeight:700,letterSpacing:.9,textTransform:"uppercase",color:"var(--text3)"}}>Reparto por sección</div>
              {!priv&&<div style={{display:"flex",height:10,borderRadius:6,overflow:"hidden",margin:"10px 0 4px"}}>
                {filas.map(f=><div key={f.k} style={{width:`${f.vm/vmT*100}%`,background:col[f.k]}}/>)}
              </div>}
              {filas.map(f=>(
                <button key={f.k} onClick={()=>setSeccion(f.k)} style={{display:"block",width:"100%",background:"none",border:"none",borderTop:"1px solid var(--border)",padding:"10px 0",cursor:"pointer",textAlign:"left",color:"var(--text)",marginTop:6}}>
                  <div style={{display:"flex",justifyContent:"space-between",alignItems:"baseline"}}>
                    <span style={{fontWeight:700,fontSize:13.5}}><span style={{display:"inline-block",width:9,height:9,borderRadius:3,background:col[f.k],marginRight:7}}/>{f.l}</span>
                    <span style={{fontFamily:"var(--display)",fontSize:14}}>{H(`${fmt(f.vm)} €`)}</span>
                  </div>
                  <div style={{display:"flex",justifyContent:"space-between",fontSize:11.5,color:"var(--text3)",marginTop:3}}>
                    <span>{f.uds} uds · invertido {H(`${fmt(f.inv)} €`)}{!priv?` · ${(f.vm/vmT*100).toFixed(0)} %`:""}</span>
                    <span style={{color:f.vm>=f.inv?"var(--green)":"var(--red)",fontWeight:700}}>{H(`${f.vm>=f.inv?"+":""}${fmt(f.vm-f.inv)} €`)}</span>
                  </div>
                  <div style={{fontSize:11.5,color:"var(--text3)",marginTop:2}}>Beneficio de ventas: <b style={{color:f.ben>=0?"var(--green)":"var(--red)"}}>{H(`${f.ben>=0?"+":""}${fmt(f.ben)} €`)}</b></div>
                </button>))}
            </div>);
          })()}

          {/* Evolucion del valor de la seccion: estimado hacia atras + fotos diarias reales */}
          {(()=>{
            const real=(state.historial||[]).map(e=>{
              if(seccion!=="todo") return e[seccion]?{d:e.d,inv:e[seccion][0],vm:e[seccion][1]}:null;
              const t=SECCIONES.reduce((a,x)=>e[x.k]?[a[0]+e[x.k][0],a[1]+e[x.k][1]]:a,[0,0]);return {d:e.d,inv:t[0],vm:t[1]};
            }).filter(Boolean);
            const est=historialEstimado(state,seccion);
            const corte=real.length?real[0].d:"9999";
            const benDe=d=>{let b=0;for(const e of est) if(e.d<=d) b=e.ben;return b;};
            const h=[...est.filter(e=>e.d<corte),...real.map(e=>({...e,ben:benDe(e.d)}))].filter(e=>e.inv>0||e.vm>0);
            const W=320,Hh=130,pad=6;
            const ult=h[h.length-1], pri=h[0];
            let svg=null;
            if(h.length>=2){
              const t=d=>new Date(d+"T00:00:00Z").getTime(), t0=t(pri.d), t1=t(ult.d);
              const xs=d=>pad+(t1>t0?(t(d)-t0)/(t1-t0):0)*(W-2*pad);
              const max=Math.max(...h.map(e=>Math.max(e.vm,e.inv,e.ben||0))),min=Math.min(0,...h.map(e=>Math.min(e.vm,e.inv,e.ben||0)));
              const ys=v=>Hh-pad-(max===min?0.5:(v-min)/(max-min))*(Hh-2*pad);
              const linea=(arr,k)=>arr.map((e,i)=>`${i?"L":"M"}${xs(e.d).toFixed(1)},${ys(e[k]).toFixed(1)}`).join(" ");
              const hEst=h.filter(e=>e.est), hReal=h.filter(e=>!e.est);
              const vmEst=hReal.length&&hEst.length?[...hEst,hReal[0]]:hEst;
              const xc=hReal.length?xs(hReal[0].d):null;
              const años=[];for(let y=+pri.d.slice(0,4)+1;y<=+ult.d.slice(0,4);y++)años.push(y);
              svg=(<svg viewBox={`0 0 ${W} ${Hh+14}`} style={{width:"100%",display:"block"}}>
                {años.map(y=>{const x=xs(`${y}-01-01`);return <g key={y}><line x1={x} x2={x} y1={pad} y2={Hh} stroke="var(--border)" strokeWidth=".6"/><text x={x} y={Hh+11} fontSize="8.5" textAnchor="middle" fill="var(--text3)">{y}</text></g>;})}
                <path d={linea(h,"vm")+` L${xs(ult.d)},${Hh} L${xs(pri.d)},${Hh} Z`} fill="var(--accent3)" opacity=".5"/>
                {vmEst.length>1&&<path d={linea(vmEst,"vm")} fill="none" stroke="var(--accent2)" strokeWidth="2" strokeDasharray="5 3" opacity=".75" strokeLinejoin="round"/>}
                {hReal.length>1&&<path d={linea(hReal,"vm")} fill="none" stroke="var(--accent2)" strokeWidth="2.4" strokeLinejoin="round"/>}
                <path d={linea(h,"inv")} fill="none" stroke="var(--text3)" strokeWidth="1.4" strokeDasharray="4 4"/>
                <path d={linea(h,"ben")} fill="none" stroke="var(--green)" strokeWidth="1.6" strokeLinejoin="round"/>
                {xc!=null&&<circle cx={xc} cy={ys(hReal[0].vm)} r="2.6" fill="var(--accent2)"/>}
              </svg>);
            }
            const dif=ult&&pri?ult.vm-pri.vm:0;
            return(
            <div style={{...S.card,padding:"14px 16px",marginBottom:10}}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"baseline"}}>
                <div style={{fontSize:10.5,fontWeight:700,letterSpacing:.9,textTransform:"uppercase",color:"var(--text3)"}}>Evolución del valor</div>
                {h.length>=2&&!priv&&<div style={{fontSize:12,fontWeight:700,color:dif>=0?"var(--green)":"var(--red)"}}>{dif>=0?"+":""}{fmt(dif)} € desde {["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"][+pri.d.slice(5,7)-1]} {pri.d.slice(0,4)}</div>}
              </div>
              {svg?<div style={{marginTop:8}}>{priv?<div style={{height:130,display:"grid",placeContent:"center",color:"var(--text3)",fontSize:12}}>Oculto</div>:svg}</div>
                :<div style={{fontSize:12.5,color:"var(--text3)",marginTop:8,lineHeight:1.45}}>Aún no hay datos suficientes.</div>}
              {svg&&!priv&&<><div style={{display:"flex",flexWrap:"wrap",gap:"4px 14px",marginTop:6,fontSize:11,color:"var(--text3)"}}>
                <span><span style={{display:"inline-block",width:12,height:3,background:"var(--accent2)",verticalAlign:"middle",marginRight:5,borderRadius:2}}/>Valor</span>
                <span><span style={{display:"inline-block",width:12,borderTop:"2px dashed var(--text3)",verticalAlign:"middle",marginRight:5}}/>Invertido</span>
                <span><span style={{display:"inline-block",width:12,height:3,background:"var(--green)",verticalAlign:"middle",marginRight:5,borderRadius:2}}/>Beneficio de ventas</span>
              </div>
              <div style={{fontSize:10.5,color:"var(--text3)",marginTop:5,lineHeight:1.4}}>Antes del {corte!=="9999"?corte.split("-").reverse().join("/"):"hoy"} el valor (línea discontinua) es estimado: compra en la fecha de lanzamiento y subida gradual hasta el valor actual. Las ventas son reales.</div></>}
            </div>);
          })()}

          {(seccion==="juegos"||seccion==="todo")&&(state.envios||[]).length>0&&<button onClick={()=>go("mapa")} style={{...S.card,width:"100%",textAlign:"left",padding:"14px 16px",marginBottom:10,cursor:"pointer",color:"var(--text)",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
            <div><div style={{fontSize:10.5,fontWeight:700,letterSpacing:.9,textTransform:"uppercase",color:"var(--text3)"}}>Mapa de envíos</div>
            <div style={{fontSize:13.5,fontWeight:700,marginTop:3}}>{(state.envios||[]).length} envíos a {new Set((state.envios||[]).map(e=>e.pais)).size} países</div></div>
            <span style={{fontSize:20}}>🌍</span>
          </button>}
          {/* Buen momento para vender */}
          {paraVender.length>0&&<button onClick={()=>go("vender")} style={{...S.card,width:"100%",textAlign:"left",padding:"14px 16px",marginBottom:10,cursor:"pointer",color:"var(--text)"}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"baseline"}}>
              <div style={{fontSize:10.5,fontWeight:700,letterSpacing:.9,textTransform:"uppercase",color:"var(--text3)"}}>Buen momento para vender</div>
              <span style={{fontSize:12,fontWeight:700,color:"var(--accent2)"}}>{paraVender.length} →</span>
            </div>
            {paraVender.slice(0,3).map(({p,m})=>(
              <div key={p.id} style={{display:"flex",justifyContent:"space-between",gap:10,marginTop:8,fontSize:12.5}}>
                <span style={{flex:1,minWidth:0,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap",fontWeight:600}}>{p.nombre}</span>
                <span style={{flex:"none",color:"var(--green)",fontWeight:700}}>{m.motivo}</span>
              </div>))}
          </button>}

          {/* Próximos lanzamientos (solo juegos) */}
          {(seccion==="juegos"||seccion==="todo")&&reservasActivas.length>0&&<>
            <div style={{display:"flex",alignItems:"center",gap:8,margin:"20px 0 10px"}}>
              <span style={{fontFamily:"var(--display)",fontSize:13,flex:1}}>Próximos lanzamientos</span>
              <button onClick={()=>setTab("reservas")} style={{background:"none",border:"none",color:"var(--accent2)",fontSize:11.5,cursor:"pointer",fontWeight:700}}>Ver todas →</button>
            </div>
            {reservasActivas.slice(0,3).map(r=>{
              const d=diasHasta(r.lanzamiento);
              const hot=d>=0&&d<=21;
              return(
                <button key={r.id} onClick={()=>{setTab("reservas");go("reservaDetalle",r);}}
                  style={{...S.card,width:"100%",textAlign:"left",display:"flex",gap:11,alignItems:"center",padding:12,marginBottom:8,cursor:"pointer",color:"var(--text)"}}>
                  <div style={{width:50,height:50,borderRadius:13,flex:"none",display:"grid",placeContent:"center",textAlign:"center",lineHeight:1,
                    background:hot?"var(--accent2)":"var(--bg3)",color:hot?"#FFFFFF":"var(--text)"}}>
                    <div style={{fontFamily:"var(--display)",fontSize:17}}>{d>=0?d:"—"}</div>
                    <div style={{fontSize:8.5,letterSpacing:.6,textTransform:"uppercase",marginTop:3,opacity:.75}}>{d===0?"hoy":"días"}</div>
                  </div>
                  <div style={{flex:1,minWidth:0}}>
                    <div style={{fontWeight:600,fontSize:13.5,lineHeight:1.25,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{r.nombre}</div>
                    <div style={{fontSize:11.5,color:"var(--text2)",marginTop:3}}>{r.lanzamiento||"sin fecha"} · {r.unidades||0} uds
                      <span style={{display:"inline-block",fontSize:10,fontWeight:700,padding:"2px 7px",borderRadius:999,background:"var(--bg3)",color:"var(--text2)",marginLeft:6}}>{r.plataforma}</span>
                    </div>
                  </div>
                </button>
              );
            })}
          </>}

          {/* Gráfica beneficios por mes — rediseño */}
          {(()=>{
            const meses={};
            ventas.forEach(m=>{
              const fecha=m.fecha||"";
              if(!fecha) return;
              const mes=fecha.slice(0,7);
              const coste=m.historico?(m.coste||0):((state.products.find(p=>p.id===m.productoId)||{}).precioCompra||0);
              const ben=(m.precioVenta-coste)*m.cantidad-(m.ebayFee||0);
              meses[mes]=(meses[mes]||0)+ben;
            });
            const keys=Object.keys(meses).sort().slice(-12); // últimos 12 meses
            if(keys.length<1) return null;
            const vals=keys.map(k=>meses[k]);
            const maxV=Math.max(...vals.map(Math.abs),1);
            const total=vals.reduce((a,b)=>a+b,0);
            const best=vals.indexOf(Math.max(...vals));
            const barH=100,barW=Math.max(18,Math.min(32,Math.floor(280/keys.length)-4));
            const MESES=["Ene","Feb","Mar","Abr","May","Jun","Jul","Ago","Sep","Oct","Nov","Dic"];
            return(
              <div style={{...S.card,padding:"16px",marginBottom:10}}>
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12}}>
                  <div>
                    <div style={{fontFamily:"var(--display)",fontSize:13,color:"var(--text)"}}>Beneficio por mes</div>
                    <div style={{fontSize:11,color:"var(--text3)",marginTop:1}}>Últimos {keys.length} meses</div>
                  </div>
                  <div style={{textAlign:"right"}}>
                    <div style={{fontSize:14,fontWeight:800,color:total>=0?"var(--green)":"var(--red)"}}>{H(`${total>=0?"+":""}${fmt(total)}€`)}</div>
                    <div style={{fontSize:10,color:"var(--text3)"}}>total acumulado</div>
                  </div>
                </div>
                <div style={{overflowX:"auto",paddingBottom:4}}>
                  <div style={{display:"flex",alignItems:"flex-end",gap:3,minWidth:keys.length*(barW+3),height:barH+28}}>
                    {keys.map((mes,i)=>{
                      const v=vals[i];
                      const isPos=v>=0;
                      const h=Math.max(3,Math.abs(v)/maxV*barH);
                      const isBest=i===best&&v>0;
                      const label=MESES[parseInt(mes.slice(5))-1]+" "+mes.slice(2,4);
                      return(
                        <button key={mes} onClick={()=>{setVentasMes(mes);go("ventas");}} style={{display:"flex",flexDirection:"column",alignItems:"center",flex:1,minWidth:barW,background:"none",border:"none",cursor:"pointer",padding:0,opacity:ventasMes&&ventasMes!==mes?0.4:1,transition:"opacity .2s"}}>
                          {isBest&&<div style={{fontSize:8,color:"var(--accent2)",fontWeight:800,marginBottom:2}}>▲</div>}
                          {!isBest&&<div style={{height:14}}/>}
                          <div style={{
                            width:"100%",height:h,
                            background:isPos?(isBest?"var(--green)":"#86efac"):"#fca5a5",
                            borderRadius:"4px 4px 2px 2px",
                            transition:"height .3s",
                            border:isBest?"2px solid #15803d":"1px solid "+(isPos?"#bbf7d0":"#fecaca"),
                          }}/>
                          {!priv&&<div style={{fontSize:8,color:isPos?"var(--green)":"var(--red)",fontWeight:700,marginTop:2,whiteSpace:"nowrap"}}>{v>=0?"+":""}{fmt(v)}€</div>}
                          <div style={{fontSize:9,color:ventasMes===mes?"var(--accent2)":"var(--text3)",fontWeight:ventasMes===mes?800:400,marginTop:1}}>{label}</div>
                        </button>
                      );
                    })}
                  </div>
                </div>
              </div>
            );
          })()}

          {/* Grupos inventario */}
          {(()=>{
            const hasAny=GRUPOS.some(g=>catStats.some(c=>g.cats.includes(c.cat)&&c.uds>0));
            if(!hasAny) return null;
            return(
              <div style={{...S.card,marginBottom:10,overflow:"hidden"}}>
                <div style={{padding:"12px 14px",borderBottom:"1px solid var(--border)",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                  <span style={{fontFamily:"var(--display)",fontSize:13}}>Inventario</span>
                  <button onClick={()=>setTab("stock")} style={{background:"none",border:"none",color:"var(--accent2)",fontSize:12,cursor:"pointer",fontWeight:600}}>Ver stock →</button>
                </div>
                {GRUPOS.map(grupo=>{
                  const items=catStats.filter(c=>grupo.cats.includes(c.cat)&&c.uds>0);
                  if(!items.length) return null;
                  const gVM=items.reduce((a,c)=>a+c.vm,0);
                  const gUds=items.reduce((a,c)=>a+c.uds,0);
                  const gRefs=items.reduce((a,c)=>a+c.refs,0);
                  return(
                    <button key={grupo.key} onClick={()=>{setTab("stock");go("grupo",grupo);}} style={{...S.row}}
                      onMouseEnter={e=>e.currentTarget.style.background="var(--bg3)"}
                      onMouseLeave={e=>e.currentTarget.style.background="transparent"}>
                      <div style={{width:5,height:38,borderRadius:3,flex:"none",background:({"PS5":"var(--ps5)","PS4":"var(--ps4)","Switch":"var(--sw)","Switch 2":"var(--sw)","Zapatillas":"var(--zp)"})[grupo.cats[0]]||"var(--accent2)"}}/>
                      <div style={{flex:1}}>
                        <div style={{fontWeight:700,fontSize:13}}>{grupo.label}</div>
                        <div style={{fontSize:11,color:"var(--text3)",marginTop:1}}>{gRefs} refs · {gUds} uds</div>
                      </div>
                      <div style={{textAlign:"right"}}>
                        <div style={{fontSize:13,fontWeight:700,color:grupo.color}}>{H(`${fmt(gVM)} €`)}</div>
                        <div style={{fontSize:10,color:"var(--text3)"}}>val. mdo.</div>
                      </div>
                      <span style={{color:"var(--border2)",fontSize:18,marginLeft:4}}>›</span>
                    </button>
                  );
                })}
              </div>
            );
          })()}

          {/* Accesos rápidos */}
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:8,marginBottom:10}}>
            {[{l:"Ventas",icon:I.billete,sub:`${ventas.length} registradas`,s:"ventas",c:"var(--green)"},
              {l:"Reservas",icon:I.calendario,sub:`${reservasActivas.length} activas`,s:"reservas",c:"var(--accent2)"},
              {l:"Oportunidades",icon:I.rayo,sub:`${oportunidades.length} detectadas`,s:"oportunidades",c:"var(--yellow)"}
            ].map(x=>(
              <button key={x.s} onClick={()=>{if(x.s==="reservas") setTab("reservas");else go(x.s);}}
                style={{...S.card,padding:"14px 12px",border:"1px solid var(--border)",cursor:"pointer",textAlign:"left",transition:"all .15s",background:"var(--bg2)"}}
                onMouseEnter={e=>e.currentTarget.style.borderColor=x.c}
                onMouseLeave={e=>e.currentTarget.style.borderColor="var(--border)"}>
                <div style={{marginBottom:7,color:x.c}}><Ico d={x.icon} size={20}/></div>
                <div style={{fontWeight:700,fontSize:11,color:"var(--text)"}}>{x.l}</div>
                <div style={{fontSize:10,color:"var(--text3)",marginTop:2}}>{x.sub}</div>
              </button>
            ))}
          </div>

          {/* Próximas reservas */}
          <div style={{...S.card,overflow:"hidden"}}>
            <div style={{padding:"12px 14px",borderBottom:"1px solid var(--border)",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
              <span style={{fontFamily:"var(--display)",fontSize:13}}>Próximas reservas</span>
              <button onClick={()=>setTab("reservas")} style={{background:"none",border:"none",color:"var(--accent2)",fontSize:12,cursor:"pointer",fontWeight:600}}>Ver todas →</button>
            </div>
            {reservasActivas.slice(0,4).map(r=>{
              const d=diasHasta(r.lanzamiento);
              const urg=d<=7?"var(--red)":d<=30?"var(--yellow)":"var(--green)";
              const urgBg=d<=7?"var(--red2)":d<=30?"var(--bg3)":"var(--bg3)";
              const cfg=CAT_CONFIG[r.plataforma]||{};
              return(
                <button key={r.id} onClick={()=>{setTab("reservas");go("reservaDetalle",r);}} style={{...S.row}}
                  onMouseEnter={e=>e.currentTarget.style.background="var(--bg3)"}
                  onMouseLeave={e=>e.currentTarget.style.background="transparent"}>
                  <div style={{width:8,height:8,borderRadius:"50%",background:urg,flexShrink:0}}/>
                  <div style={{flex:1,minWidth:0}}>
                    <div style={{fontWeight:600,fontSize:12,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{r.nombre}</div>
                    <div style={{fontSize:11,color:"var(--text3)",marginTop:1}}>{r.plataforma} · {r.lanzamiento}</div>
                  </div>
                  <span style={{color:urg,fontWeight:800,fontSize:12,flexShrink:0}}>{d>0?`${d}d`:d===0?"HOY":"Pasó"}</span>
                  <span style={{color:"var(--border2)",fontSize:18,marginLeft:4}}>›</span>
                </button>
              );
            })}
            {reservasActivas.length===0&&<div style={{padding:30,textAlign:"center",color:"var(--text3)"}}>Sin reservas activas</div>}
          </div>
        </div>}

        {/* ══════════════════════════ STOCK ═════════════════════════════ */}
        {screen==="stock"&&<div className="fade-in">
          <div style={{position:"relative",marginBottom:10}}>
            <svg viewBox="0 0 24 24" style={{position:"absolute",left:13,top:13,width:17,height:17,fill:"none",stroke:"var(--text3)",strokeWidth:2,strokeLinecap:"round"}}><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-3.6-3.6"/></svg>
            <input value={q} onChange={e=>setQ(e.target.value)} placeholder={`Buscar en ${prodsS.length} referencias…`}
              style={{width:"100%",background:"var(--bg2)",border:"1px solid var(--border)",borderRadius:14,
                padding:"11px 38px 11px 38px",fontSize:13.5,color:"var(--text)",outline:"none",boxShadow:"var(--card-shadow)"}}/>
            {q&&<button onClick={()=>setQ("")} style={{position:"absolute",right:10,top:9,width:24,height:24,borderRadius:8,background:"var(--bg3)",border:"none",cursor:"pointer",color:"var(--text2)",fontSize:13}}>×</button>}
          </div>

          {q.trim().length>0&&(()=>{
            const t=q.trim().toLowerCase();
            const res=prodsS.filter(p=>(p.nombre||"").toLowerCase().includes(t)||(p.sku||"").toLowerCase().includes(t));
            return(
              <div style={{...S.card,overflow:"hidden",marginBottom:10}}>
                <div style={{padding:"11px 14px",borderBottom:"1px solid var(--border)",fontSize:11.5,fontWeight:700,color:"var(--text2)"}}>
                  {res.length} {res.length===1?"resultado":"resultados"}
                </div>
                {res.slice(0,40).map(p=>(
                  <button key={p.id} onClick={()=>go("producto",p)} style={{...S.row}}>
                    <div style={{width:5,height:34,borderRadius:3,flex:"none",background:({"PS5":"var(--ps5)","PS4":"var(--ps4)","Switch":"var(--sw)","Switch 2":"var(--sw)","Zapatillas":"var(--zp)"})[p.categoria]||"var(--accent2)"}}/>
                    <div style={{flex:1,minWidth:0}}>
                      <div style={{fontWeight:600,fontSize:13,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{p.nombre}</div>
                      <div style={{fontSize:11,color:"var(--text3)",marginTop:1,display:"flex",alignItems:"center",gap:5}}>
                        <span>{p.categoria} · {p.stock} uds</span>
                        {!p.valorFuente&&<span style={{fontSize:9,fontWeight:700,color:"var(--text3)",background:"var(--bg3)",borderRadius:4,padding:"1px 4px"}}>a mano</span>}

        </div>
        <Btns onCancel={()=>setModal(null)} onSave={()=>{dispatch({type:"SET_VENTA_CFG",payload:{comision:+ventaForm.comision||0,envio:+ventaForm.envio||0}});setModal(null);}}/>
      </Sheet>}

      {modal==="copias"&&<Sheet onClose={()=>setModal(null)} title="Copias automáticas">
        <div style={{fontSize:12.5,color:"var(--text2)",lineHeight:1.45,marginBottom:12}}>
          Cada semana la app guarda una copia de todo en este dispositivo y conserva las 8 últimas. Si algo se rompe, puedes volver a una de ellas.
        </div>
        {copias.length===0&&<div style={{fontSize:13,color:"var(--text3)",padding:"8px 0"}}>Todavía no hay ninguna. La primera se hace sola al abrir la app.</div>}
        {copias.map(k=>(
          <div key={k} style={{display:"flex",alignItems:"center",gap:10,padding:"10px 0",borderBottom:"1px solid var(--border)"}}>
            <span style={{flex:1,fontSize:13.5,fontWeight:600}}>{k}</span>
            <button onClick={async()=>{
              if(!window.confirm(`¿Volver a la copia del ${k}? Se perderá lo que hayas cambiado después.`)) return;
              try{const data=JSON.parse(await COPIAS.leer(k));
                await COPIAS.guardar(new Date().toISOString().split("T")[0]+" (antes de restaurar)",JSON.stringify(stateRef.current));
                localStorage.setItem(LS_KEY,JSON.stringify(data));
                if(user) await guardar(data,{forzar:true});
                window.location.reload();
              }catch(e){showToast("No se pudo restaurar","var(--red)");}
            }} style={{background:"var(--accent3)",border:"none",borderRadius:8,padding:"6px 11px",color:"var(--accent2)",fontWeight:700,fontSize:12,cursor:"pointer"}}>Restaurar</button>
          </div>))}
        <Btns onCancel={()=>setModal(null)} onSave={async()=>{await COPIAS.guardar(new Date().toISOString().split("T")[0]+" (manual)",JSON.stringify(stateRef.current));setCopias(await COPIAS.lista());showToast("Copia hecha");}} saveLabel="Hacer copia ahora"/>
      </Sheet>}

      {modal==="capital"&&<Sheet onClose={()=>setModal(null)} title="Tu dinero en el negocio">
        <div style={{fontSize:12.5,color:"var(--text2)",lineHeight:1.45,marginBottom:13}}>
          Lo puesto por ti es todo lo que has gastado menos lo que has cobrado en ventas (ya descontadas comisiones). El dinero de las ventas que vuelves a meter no cuenta como tuyo. Si alguna vez sacas dinero para ti, apúntalo aquí.
        </div>
        <Field label="Empezaste en"><input type="date" value={capForm.inicio||""} onChange={e=>{setCapForm({...capForm,inicio:e.target.value});dispatch({type:"SET_CAPITAL",payload:{inicio:e.target.value}});}} style={S.inp()}/></Field>
        <div style={{fontSize:11,fontWeight:700,letterSpacing:.6,textTransform:"uppercase",color:"var(--text3)",margin:"6px 0 8px"}}>Dinero sacado</div>
        {((state.capital||{}).retiradas||[]).length===0&&<div style={{fontSize:12.5,color:"var(--text3)",marginBottom:10}}>Nada sacado hasta ahora.</div>}
        {((state.capital||{}).retiradas||[]).map(r=>(
          <div key={r.id} style={{display:"flex",alignItems:"center",gap:10,padding:"8px 0",borderBottom:"1px solid var(--border)"}}>
            <span style={{flex:1,fontSize:13}}>{r.fecha}</span>
            <span style={{fontWeight:700,fontSize:13}}>{H(`${fmt(+r.importe)} €`)}</span>
            <button onClick={()=>dispatch({type:"SET_CAPITAL",payload:{retiradas:(state.capital.retiradas||[]).filter(x=>x.id!==r.id)}})} style={{background:"none",border:"none",color:"var(--red)",cursor:"pointer",fontSize:12,fontWeight:700}}>Quitar</button>
          </div>))}
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,margin:"12px 0 13px"}}>
          <Field label="Fecha"><input type="date" value={capForm.fecha||today} onChange={e=>setCapForm({...capForm,fecha:e.target.value})} style={S.inp()}/></Field>
          <Field label="Importe (€)"><input type="number" min={0} step={0.01} value={capForm.importe} onChange={e=>setCapForm({...capForm,importe:e.target.value})} style={S.inp()} placeholder="0.00"/></Field>
        </div>
        <Btns onCancel={()=>setModal(null)} onSave={()=>{
          const imp=+capForm.importe;
          if(imp>0){dispatch({type:"SET_CAPITAL",payload:{retiradas:[...((state.capital||{}).retiradas||[]),{id:Date.now(),fecha:capForm.fecha||today,importe:imp}]}});setCapForm({...capForm,importe:""});showToast("Retirada apuntada");}
          else setModal(null);
        }} saveLabel="Apuntar retirada"/>
      </Sheet>}

      {modal==="reserva"&&<Sheet onClose={()=>{setModal(null);setEditId(null);setFormR(EMPTY_R);}} title={editId?" Editar reserva":"Nueva reserva"}>
        <Field label="Nombre"><input type="text" value={formR.nombre} onChange={e=>setFormR({...formR,nombre:e.target.value})} style={S.inp()} onFocus={e=>e.target.style.borderColor="var(--accent2)"} onBlur={e=>e.target.style.borderColor="var(--border)"}/></Field>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:13}}>
          <Field label="Plataforma"><select value={formR.plataforma} onChange={e=>setFormR({...formR,plataforma:e.target.value})} style={S.inp()}>{PLATAFORMAS.map(p=><option key={p}>{p}</option>)}</select></Field>
          <Field label="Lanzamiento"><input type="date" value={formR.lanzamiento} onChange={e=>setFormR({...formR,lanzamiento:e.target.value})} style={S.inp()}/></Field>
        </div>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:13}}>
          <Field label="Unidades"><input type="number" min={0} value={formR.unidades||0} onChange={e=>setFormR({...formR,unidades:e.target.value})} style={S.inp()}/></Field>
          <Field label="Señal pagada (€)"><input type="number" min={0} step={0.01} value={formR.costeTotal||0} onChange={e=>setFormR({...formR,costeTotal:e.target.value})} style={S.inp()}/></Field>
        </div>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:13}}>
          <Field label="Pendiente (€)"><input type="number" min={0} step={0.01} value={formR.costePendiente||0} onChange={e=>setFormR({...formR,costePendiente:e.target.value})} style={S.inp()}/></Field>
          <Field label="Precio final ud (€)"><input type="number" min={0} step={0.01} value={formR.precioFinal||0} onChange={e=>setFormR({...formR,precioFinal:e.target.value})} style={S.inp()} placeholder="Precio total por unidad"/></Field>
        </div>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:13}}>
          <Field label="Tienda"><input type="text" value={formR.tienda} onChange={e=>setFormR({...formR,tienda:e.target.value})} placeholder="Amazon, GAME…" style={S.inp()}/></Field>
          <Field label="URL tienda"><input type="text" value={formR.urlTienda||""} onChange={e=>setFormR({...formR,urlTienda:e.target.value})} placeholder="https://…" style={S.inp()}/></Field>
        </div>
        <Field label="Notas"><input type="text" value={formR.notas} onChange={e=>setFormR({...formR,notas:e.target.value})} placeholder="Detalles…" style={S.inp()}/></Field>
        <Btns onCancel={()=>{setModal(null);setEditId(null);setFormR(EMPTY_R);}} onSave={saveR}/>
      </Sheet>}

      {modal==="search"&&<GameSearcher
        onClose={()=>setModal(null)}
        onSelect={(result)=>{
          setFormP({...EMPTY_P,nombre:result.nombre,categoria:result.plataforma||"PS5",sku:result.sku||"",cover:result.cover||""});
          setEditId(null);
          setModal("add");
        }}
      />}

      {/* ── RADAR SETTINGS ── */}
      {radarSettings&&<Sheet onClose={()=>setRadarSettings(false)} title="Fuentes del Radar">
        {[
          {key:"telegram",label:"Telegram",sources:(state.radarSources?.telegram||[])},
          {key:"publishers",label:"Medios ES",sources:(state.radarSources?.publishers||[])},
          {key:"news",label:"Medios EN",sources:(state.radarSources?.news||[])},
        ].map(group=>(
          <div key={group.key} style={{marginBottom:16}}>
            <div style={{fontSize:11,fontWeight:700,color:"var(--text2)",textTransform:"uppercase",letterSpacing:.5,marginBottom:8}}>{group.label}</div>
            <div style={{...S.card,overflow:"hidden"}}>
              {group.sources.map((src,i)=>{
                const active=(state.radarSources?.[group.key]||[]).includes(src);
                return(
                  <div key={src} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"10px 14px",borderBottom:i<group.sources.length-1?"1px solid var(--border)":"none"}}>
                    <span style={{fontSize:13,color:active?"var(--text)":"var(--text3)"}}>{src}</span>
                    <button onClick={()=>{
                      const current=state.radarSources?.[group.key]||[];
                      const updated=active?current.filter(s=>s!==src):[...current,src];
                      dispatch({type:"SET_RADAR_SOURCES",payload:{[group.key]:updated}});
                    }} style={{background:active?"var(--accent2)":"var(--bg3)",border:"none",borderRadius:20,padding:"4px 12px",cursor:"pointer",fontSize:11,fontWeight:700,color:active?"#fff":"var(--text3)"}}>
                      {active?"Activo":"Inactivo"}
                    </button>
                  </div>
                );
              })}
            </div>
          </div>
        ))}
        <div style={{fontSize:11,color:"var(--text3)",textAlign:"center",marginTop:8}}>Los cambios se aplican al recargar las noticias</div>
        <div style={{marginTop:16}}>
          <div style={{fontSize:11,fontWeight:700,color:"var(--text2)",textTransform:"uppercase",letterSpacing:.5,marginBottom:8}}> Alertas por palabras clave</div>
          <div style={{fontSize:11,color:"var(--text3)",marginBottom:8}}>Separa con comas. Ej: shenmue, bloodrayne, switch 2</div>
          <textarea
            defaultValue={(state.radarKeywords||[]).join(", ")}
            onBlur={e=>{
              const kws=e.target.value.split(",").map(k=>k.trim().toLowerCase()).filter(k=>k.length>0);
              dispatch({type:"SET_RADAR_KEYWORDS",payload:kws});
            }}
            style={{...S.inp(),height:70,resize:"none",fontFamily:"inherit"}}
            placeholder="shenmue, bloodrayne, switch 2..."/>
          <div style={{fontSize:11,color:"var(--text3)",marginTop:4}}>Las noticias que contengan estas palabras aparecerán marcadas con </div>
        </div>
      </Sheet>}

    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);

/* ── PWA Service Worker ── */
if("serviceWorker" in navigator){
  window.addEventListener("load",()=>{
    navigator.serviceWorker.register("sw.js").then(reg=>{
      // Pedir permiso notificaciones y programar check diario
      if("Notification" in window && Notification.permission==="default"){
        Notification.requestPermission();
      }
      // Check reservas cada vez que se carga la app
      if(Notification.permission==="granted"){
        navigator.serviceWorker.ready.then(r=>{
          const state=JSON.parse(localStorage.getItem("gsp_v3")||"{}");
          if(state.reservas){
            r.active?.postMessage({type:"CHECK_RESERVAS",reservas:state.reservas});
          }
        });
      }
    }).catch(()=>{});
  });
}
</script>
</body>
</html>
